name: Package managers

on:
  push:
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - packaging/**
      - test_package/**
      - tests/cmake/**
      - .github/workflows/package-managers.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - packaging/**
      - test_package/**
      - tests/cmake/**
      - .github/workflows/package-managers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-managers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Conan
        run: python -m pip install --disable-pip-version-check conan

      - name: Create package
        env:
          CC: clang
          CXX: clang++
        run: ./scripts/check-conan-package.sh

  vcpkg:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git \
            "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install and consume overlay port
        env:
          CC: clang
          CXX: clang++
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: ./scripts/check-vcpkg-package.sh -DCMAKE_CXX_COMPILER=clang++

  cpm:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build and run consumer
        run: ./scripts/check-cpm-package.sh -DCMAKE_CXX_COMPILER=clang++

  cpack:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build and verify packages
        run: ./scripts/check-cpack-package.sh -DCMAKE_CXX_COMPILER=clang++
