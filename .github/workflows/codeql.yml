name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect analysis changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}

    steps:
      - uses: actions/checkout@v7

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - ".github/workflows/codeql.yml"
              - "CMakeLists.txt"
              - "cmake/**"
              - "include/**"
              - "tests/**"
              - "scripts/run-native-ci.sh"

  analyze:
    needs: changes
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.build == 'true') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    name: Analyze C++
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build and test
        run: >-
          ./scripts/run-native-ci.sh build RelWithDebInfo
          -DJPLCZ_RELOCO_ENABLE_STRICT_WARNINGS=OFF

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
