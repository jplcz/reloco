<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260">
  <defs>
    <linearGradient id="body-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="smoke-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Motion lines: the engine is mid-run, never standing still -->
  <g stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="330" y1="150" x2="370" y2="150"/>
    <line x1="340" y1="170" x2="390" y2="170"/>
    <line x1="330" y1="190" x2="375" y2="190"/>
  </g>

  <!-- Smoke puffs -->
  <circle cx="108" cy="42" r="20" fill="url(#smoke-fill)"/>
  <circle cx="138" cy="24" r="15" fill="url(#smoke-fill)"/>
  <circle cx="160" cy="10" r="10" fill="url(#smoke-fill)"/>

  <!-- Smokestack -->
  <path d="M88,100 L88,60 C88,52 96,46 106,46 C116,46 124,52 124,60 L124,100 Z"
        fill="url(#body-fill)" stroke="url(#accent-fill)" stroke-width="4"/>

  <!-- Boiler (cylindrical front body) -->
  <rect x="60" y="100" width="190" height="70" rx="35" fill="url(#body-fill)" stroke="url(#accent-fill)" stroke-width="5"/>

  <!-- Headlamp -->
  <circle cx="75" cy="118" r="13" fill="#fbbf24" stroke="url(#accent-fill)" stroke-width="3"/>

  <!-- Cab -->
  <path d="M250,80 L320,80 C332,80 342,90 342,102 L342,170 L250,170 Z"
        fill="url(#body-fill)" stroke="url(#accent-fill)" stroke-width="5"/>
  <rect x="270" y="98" width="42" height="34" rx="6" fill="#0b1220" stroke="url(#accent-fill)" stroke-width="4"/>

  <!-- Cowcatcher (front plow) -->
  <path d="M60,170 L60,140 L26,170 Z" fill="url(#body-fill)" stroke="url(#accent-fill)" stroke-width="4"/>

  <!-- Running board / undercarriage -->
  <rect x="44" y="170" width="300" height="14" rx="6" fill="url(#body-fill)" stroke="url(#accent-fill)" stroke-width="3"/>

  <!-- Wheels -->
  <g stroke="url(#accent-fill)" stroke-width="5">
    <circle cx="108" cy="206" r="30" fill="#0b1220"/>
    <circle cx="196" cy="206" r="30" fill="#0b1220"/>
    <circle cx="284" cy="206" r="30" fill="#0b1220"/>
  </g>
  <g fill="url(#accent-fill)">
    <circle cx="108" cy="206" r="7"/>
    <circle cx="196" cy="206" r="7"/>
    <circle cx="284" cy="206" r="7"/>
  </g>
  <!-- Coupling rod linking the wheels -->
  <rect x="108" y="200" width="176" height="12" rx="6" fill="url(#accent-fill)" opacity="0.9"/>
</svg>
